<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Jarvis banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1d30"/>
      <stop offset="55%" stop-color="#081221"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="bring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df3ff"/>
      <stop offset="50%" stop-color="#22b8e6"/>
      <stop offset="100%" stop-color="#0e6f9e"/>
    </linearGradient>
    <filter id="bglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="392" rx="56" fill="url(#bbg)" stroke="#1e3a52" stroke-width="2"/>

  <!-- reactor compacto -->
  <g stroke="#2bd9ff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="330" y1="200" x2="318" y2="200"/>
    <line x1="312.6" y1="265" x2="302.2" y2="259"/>
    <line x1="265" y1="312.6" x2="259" y2="302.2"/>
    <line x1="200" y1="330" x2="200" y2="318"/>
    <line x1="135" y1="312.6" x2="141" y2="302.2"/>
    <line x1="87.4" y1="265" x2="97.8" y2="259"/>
    <line x1="70" y1="200" x2="82" y2="200"/>
    <line x1="87.4" y1="135" x2="97.8" y2="141"/>
    <line x1="135" y1="87.4" x2="141" y2="97.8"/>
    <line x1="200" y1="70" x2="200" y2="82"/>
    <line x1="265" y1="87.4" x2="259" y2="97.8"/>
    <line x1="312.6" y1="135" x2="302.2" y2="141"/>
  </g>
  <circle cx="200" cy="200" r="108" fill="none" stroke="url(#bring)" stroke-width="9" filter="url(#bglow)"/>
  <circle cx="200" cy="200" r="88" fill="none" stroke="#0f2c46" stroke-width="24"/>
  <g fill="#2aa5d4">
    <rect x="194" y="101" width="12" height="22" rx="5"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(36 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(72 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(108 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(144 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(180 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(216 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(252 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(288 200 200)"/>
    <rect x="194" y="101" width="12" height="22" rx="5" transform="rotate(324 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="54" fill="#06121d" stroke="#35e0ff" stroke-width="5" filter="url(#bglow)"/>
  <path d="M200 162 L236 226 L164 226 Z" fill="none" stroke="#aef6ff" stroke-width="8" stroke-linejoin="round" filter="url(#bglow)"/>

  <!-- divisor -->
  <line x1="368" y1="70" x2="368" y2="330" stroke="#1e3a52" stroke-width="2"/>

  <!-- título -->
  <text x="412" y="196" font-family="DejaVu Sans, Verdana, sans-serif" font-size="112" letter-spacing="22" fill="#d7f6ff">JARVIS</text>
  <text x="416" y="248" font-family="DejaVu Sans, Verdana, sans-serif" font-size="29" letter-spacing="3" fill="#7fb3d5">Asistente de voz para Linux · orientado a tareas</text>

  <!-- pills -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" font-size="20" letter-spacing="2">
    <rect x="412" y="278" width="288" height="46" rx="23" fill="#0b1c2e" stroke="#2bd9ff" stroke-width="2"/>
    <text x="432" y="308" fill="#aee9ff">STT · FASTER-WHISPER</text>
    <rect x="712" y="278" width="262" height="46" rx="23" fill="#0b1c2e" stroke="#2bd9ff" stroke-width="2"/>
    <text x="732" y="308" fill="#aee9ff">LLM · GROQ / OLLAMA</text>
    <rect x="986" y="278" width="158" height="46" rx="23" fill="#0b1c2e" stroke="#2bd9ff" stroke-width="2"/>
    <text x="1006" y="308" fill="#aee9ff">TTS · PIPER</text>
  </g>
</svg>
