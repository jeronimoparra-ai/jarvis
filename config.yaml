# Jarvis Configuration
# Wake word settings
wake_word:
  engine: "openwakeword"  # openwakeword or vosk
  model: "hey_jarvis"     # Wake word model name
  sensitivity: 0.6
  cooldown_s: 1.0

# Speech-to-text settings
stt:
  engine: "faster_whisper"
  model_size: "tiny"      # tiny, base, small, medium, large
  device: "cpu"           # cpu, cuda o auto
  compute_type: "int8"    # int8 recomendado en CPU modesta
  cpu_threads: 4
  num_workers: 1
  language: "es"          # Language for transcription

# Voice activity detection (VAD) / grabación
vad:
  threshold: 500
  silence_timeout_s: 1.2
  max_recording_s: 12
  min_speech_s: 0.25

# Text-to-speech settings
tts:
  engine: "piper"
  voice: "es_ES-davefx-medium"  # Nombre de voz piper (se descarga sola una vez)
  enabled: true
  silent_mode: false
  speed: 1.0
  volume: 1.0

# LLM settings (fallback when rules don't match)
llm:
  provider: "groq"        # groq, cerebras, gemini, openrouter, offline
  fallback_order: ["cerebras", "gemini", "openrouter", "offline"]
  max_provider_attempts: 5
  max_tokens: 48          # Keep responses short
  temperature: 0.1
  intent_min_confidence: 0.6
  retry:
    max_attempts: 2
    base_backoff_s: 0.5
  groq:
    api_key: ""
    model: "llama-3.1-8b-instant"
  cerebras:
    api_key: ""
    base_url: "https://api.cerebras.ai/v1"
    model: "llama3.1-8b"
  gemini:
    api_key: ""
    model: "gemini-1.5-flash"
  openrouter:
    api_key: ""
    base_url: "https://openrouter.ai/api/v1"
    model: "meta-llama/llama-3.1-8b-instruct:free"

# Audio settings
audio:
  input_device: "default"
  output_device: "default"
  sample_rate: 16000
  chunk_size: 1024
  silence_threshold: 500

# Skill settings
skills:
  directory: "skills"
  auto_reload: true
  enabled:
    - system
    - apps
    - terminal
    - web
    - clock
    - media
    - reminder
    - routines
    - window
    - dictation
    - status
    - opencode
    - audit_skill
    - coding
    - security
    - chat

# Automatización cursor/teclado (xdotool en Linux)
input_control:
  enabled: true
  allow_typing: true
  max_type_chars: 500

# Reproducción: youtube o ytmusic (YouTube Music auto-reproduce el watch)
media:
  youtube_load_wait_s: 3.5
  default_provider: youtube  # pon "ytmusic" para música automática por defecto

# Ayuda de programación
coding:
  editors: ["cursor", "code", "codium"]
  default_editor: "code"
  allowed_commands:
    - "pytest"
    - "python -m unittest"
    - "npm test"
    - "npm run build"
    - "cargo test"
    - "go test"
    - "git status"
    - "git diff"
  open_opencode_on_fix_requests: true

# Seguridad defensiva (solo este equipo; nada ofensivo)
security:
  enabled: true
  allow_lan_scan: false          # default false: solo 127.0.0.1 / IPs propias
  allow_firewall_changes: false  # si true, cambiar firewall exige confirma
  baseline_paths:
    - "~/.ssh"
    - "~/.bashrc"
    - "~/.config"
  clamav_default_path: "~/Downloads"
  max_ports_listed: 15
  max_processes_listed: 8

# Confirmación por voz (una acción pendiente a la vez)
pending:
  timeout_seconds: 12

# Historial de acciones + deshacer
audit:
  enabled: true

# Rendimiento y seguridad operativa
performance:
  log_timings: false       # true + JARVIS_DEBUG=1 para ver route/stt/tts ms
  subprocess_timeout_s: 10 # default cuando la skill no fija uno propio
  http_timeout_s: 10       # Groq/Ollama/Wikipedia
  status_cache_s: 3        # caché de "estado del pc" repetido

# Rutinas configurables (triggers + pasos). Edita URLs y apps a tu gusto.
# Acciones: open_url, open_app, volume {percent}, notify, lock,
#           screenshot, brightness {percent}, media_pause, wait {seconds}
routines:
  modo_fiesta:
    triggers: ["modo fiesta", "activar fiesta", "fiesta"]
    steps:
      - { action: play_youtube, query: "lo-fi hip hop radio" }
      - { action: open_app, app: "code" }
      - { action: volume, percent: 60 }
  modo_trabajo:
    triggers: ["modo trabajo", "modo office"]
    steps:
      - { action: volume, percent: 30 }
      - { action: open_app, app: "code" }
      - { action: open_app, app: "terminal" }
      - { action: notify, message: "Modo trabajo" }
  cancion_favorita:
    triggers: ["pon mi canción", "pon mi cancion", "mi canción de youtube"]
    steps:
      - { action: open_url, url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" }
      - { action: volume, percent: 65 }

# Nombres lógicos de apps por SO (para pasos open_app de rutinas)
apps_map:
  linux:
    terminal: "gnome-terminal"
    code: "code"
    browser: "firefox"
    spotify: "spotify"
  windows:
    terminal: "wt.exe"
    code: "Code.exe"
    browser: "chrome"
    spotify: "Spotify.exe"

# Web search settings
web_search:
  provider: "duckduckgo"  # duckduckgo, google, brave
  results_count: 3
